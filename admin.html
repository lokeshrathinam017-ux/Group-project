<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <!--Tailwind CSS CDN link-->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#E9FAF5] text-[#222222] font-['Poppins']">
    <!--Admin login page-->
    <div class="min-h-screen flex items-center justify-center">
        <div class="m-5 bg-white w-full max-w-md rounded-xl shadow-lg p-5 ">
            <form id="loginform" class="flex flex-col w-full">

                <h1 class="text-3xl md:text-4xl font-bold mt-3 text-center text-[#222222]">CampusBite</h1>
                <h2 class="text-2xl font-semibold mt-4 text-center">Admin Management System</h2>
                <p class="text-xl font-normal mt-6 mb-4 border border-gray-400  mx-auto  w-fit px-3 py-1">Admin Login
                </p>
                <label for="adminid" class="mt-4">AdminId</label>
                <input
                    class="border border-gray-400 w-full text-left mt-2 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#39C6A5] focus:border-transparent rounded-xl"
                    type="text" id="adminid" placeholder="Enter your AdminId">

                <p class="text-center text-red-600" id="iderror"></p>


                <label for="password" class="mt-4">Password</label>
                <input
                    class="border border-gray-400 w-full text-left mt-2 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#39C6A5] focus:border-transparent rounded-xl"
                    type="password" id="password" placeholder="Enter your Password">
                <p class="text-center text-red-600" id="passwderror"></p>

                <button
                    class=" bg-[#FF5A4F] rounded-xl  mt-8 mx-auto  w-32 py-3 text-white font-semibold hover:bg-[#E94E44]"
                    type="submit" id="loginbtn">Login</button>
            </form>


        </div>
    </div>

    <script src="admin.js"></script>

</body>

</html>

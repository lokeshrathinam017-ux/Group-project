<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - CampusBite</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style_stu.css">
</head>

<body>

    <div class="orders-container">

        <!-- Header -->
        <div class="orders-header">

            <a href="profile.html" class="back-btn">
                ←
            </a>

            <h1>My Orders</h1>

        </div>


        <!-- Order 1 -->
        <div class="order-card">

            <div class="order-top">

                <h2>Order #001</h2>

                <span class="status preparing">
                    Preparing
                </span>

            </div>

            <p class="order-date">
                21 Aug 2026
            </p>

            <div class="order-items">

                <p>Chicken Rice × 1</p>

                <p>Fresh Juice × 1</p>

            </div>

            <div class="order-bottom">

                <div>
                    <p class="total-label">Total</p>
                    <p class="total-price">₹150</p>
                </div>

                <a href="order_tracker.html" class="track-btn">
                    Track Order
                </a>

            </div>

        </div>


        <!-- Order 2 -->
        <div class="order-card">

            <div class="order-top">

                <h2>Order #002</h2>

                <span class="status ready">
                    Ready for Pickup
                </span>

            </div>

            <p class="order-date">
                20 Aug 2026
            </p>

            <div class="order-items">

                <p>Veg Meals × 1</p>

                <p>Lime Juice × 1</p>

            </div>

            <div class="order-bottom">

                <div>
                    <p class="total-label">Total</p>
                    <p class="total-price">₹120</p>
                </div>

                <a href="order_tracker.html" class="track-btn">
                    Track Order
                </a>

            </div>

        </div>


        <!-- Order 3 -->
        <div class="order-card">

            <div class="order-top">

                <h2>Order #003</h2>

                <span class="status delivered">
                    Delivered
                </span>

            </div>

            <p class="order-date">
                18 Aug 2026
            </p>

            <div class="order-items">

                <p>Paneer Fried Rice × 1</p>

            </div>

            <div class="order-bottom">

                <div>
                    <p class="total-label">Total</p>
                    <p class="total-price">₹110</p>
                </div>

            </div>

        </div>

    </div>

    <script src = "order_stu.js">

    </script>
</body>

</html>

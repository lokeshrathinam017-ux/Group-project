<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Tracker - CampusBite</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style_stu.css">
</head>

<body>

    <div class="tracker-container">

        <!-- Header -->
        <div class="tracker-header">

            <a href="order_stu.html" class="back-btn">
                ←
            </a>

            <h1>Track Order</h1>

        </div>


        <!-- Order Details -->
        <div class="tracker-card">

            <div class="tracker-order-top">

                <div>
                    <h2>Order #001</h2>
                    <p>Chicken Rice × 1</p>
                    <p>Fresh Juice × 1</p>
                </div>

                <span class="tracker-status">
                    Preparing
                </span>

            </div>


            <!-- Tracking -->
            <div class="tracking">

                <!-- Step 1 -->
                <div class="tracking-step completed">

                    <div class="tracker-circle">
                        ✓
                    </div>

                    <div>
                        <h3>Order Confirmed</h3>
                        <p>Your order has been confirmed</p>
                    </div>

                </div>


                <div class="tracker-line completed-line"></div>


                <!-- Step 2 -->
                <div class="tracking-step active">

                    <div class="tracker-circle">
                        2
                    </div>

                    <div>
                        <h3>Preparing</h3>
                        <p>Your food is being prepared</p>
                    </div>

                </div>


                <div class="tracker-line"></div>


                <!-- Step 3 -->
                <div class="tracking-step">

                    <div class="tracker-circle">
                        3
                    </div>

                    <div>
                        <h3>Ready for Pickup</h3>
                        <p>Your order will be ready soon</p>
                    </div>

                </div>


                <div class="tracker-line"></div>


                <!-- Step 4 -->
                <div class="tracking-step">

                    <div class="tracker-circle">
                        4
                    </div>

                    <div>
                        <h3>Delivered</h3>
                        <p>Order collected successfully</p>
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard-Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <!--Tailwind CSS CDN link-->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#E9FAF5] text-[#222222] font-['Poppins']">

    <div class="w-full max-w-[1200px] mx-auto px-4 md:px-6 lg:px-12 mt-5">
        <div class="flex items-center justify-between bg-white border border-gray-400 rounded-xl shadow-sm px-4 py-2">
            <a href="dashboard.html" class="text-xl font-bold">
                Campus<span class="text-[#FF5A4F]">Bite</span>
            </a>

            <div class="flex items-center gap-4">
                <p>Admin</p>
                <button type="button" id="logoutbtn"
                    class="border border-[#FF5A4F] text-[#FF5A4F] px-3 py-2 rounded-lg hover:bg-[#FF5A4F] hover:text-white">
                    Logout
                </button>
            </div>
        </div>
    </div>

    <!---Main-->

    <!-- Admin layout -->
    <div class="flex flex-col lg:flex-row w-full max-w-[1200px] mx-auto px-4 md:px-6 lg:px-12 mt-8 gap-5">
        <!-- Left sidebar -->

        <aside class="w-full lg:w-56 lg:mt-16 self-start bg-white border border-gray-400 rounded-xl p-4 mb-4">
            <nav class="flex flex-col gap-1">

                <a href="dashboard.html" class="px-3 py-2 rounded-lg bg-[#FFF1F0] text-[#FF5A4F] font-semibold">
                    Dashboard
                </a>

                <a href="restaurants_admin.html" class="px-3 py-2 rounded-lg hover:bg-[#E9FAF5]">
                    Restaurants
                </a>

                <a href="fooditems.html" class="px-3 py-2 rounded-lg hover:bg-[#E9FAF5]">
                    Food Items
                </a>

                <a href="orders.html" class="px-3 py-2 rounded-lg hover:bg-[#FFF1F0]">
                    Orders
                </a>

                <a href="student.html" class="px-3 py-2 rounded-lg hover:bg-[#E9FAF5]">
                    Students
                </a>
            </nav>
        </aside>

        <!-- Right dashboard -->
        <main class="flex-1 w-full">
            <h1 class="text-2xl md:text-4xl text-center font-semibold">
                Admin Dashboard
            </h1>

            <!-- Dashboard summary cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mt-5">

                <!-- Restaurants -->
                <section class="bg-white border border-gray-300 border-l-4 border-l-[#FF5A4F] rounded-xl shadow-sm p-5">

                    <p class="text-lg md:text-xl font-semibold">
                        Restaurants
                    </p>

                    <p class="text-2xl font-semibold text-[#FF5A4F] mt-1">
                        12
                    </p>
                </section>

                <!-- Food Items -->
                <section class="bg-white border border-gray-300 border-l-4 border-l-[#39C6A5] rounded-xl shadow-sm p-5">

                    <p class="text-lg md:text-xl font-semibold">
                        Food Items
                    </p>

                    <p class="text-2xl font-semibold text-[#16866D] mt-1">
                        25
                    </p>
                </section>

                <!-- Students -->
                <section class="bg-white border border-gray-300 border-l-4 border-l-blue-500 rounded-xl shadow-sm p-5">

                    <p class="text-lg md:text-xl font-semibold">
                        Students
                    </p>

                    <p class="text-2xl font-semibold text-blue-600 mt-1">
                        500
                    </p>
                </section>

                <!-- Orders -->
                <section
                    class="bg-white border border-gray-300 border-l-4 border-l-purple-500 rounded-xl shadow-sm p-5">

                    <p class="text-lg md:text-xl font-semibold">
                        Orders
                    </p>

                    <p class="text-2xl font-semibold text-purple-600 mt-1">
                        80
                    </p>
                </section>

            </div>

            <div id="Recent-orders">
                <h2 class="text-center text-2xl m-3 font-semibold">Recent Orders</h2>
                <section class=" mb-4 text-left border bg-white border-gray-400 mt-3 overflow-x-auto rounded-xl">

                    <table class="w-full border-collapse">
                        <thead class="bg-[#E9FAF5]">
                            <tr>
                                <th class="border-b p-3">Order Id</th>
                                <th class="border-b p-3">Student</th>
                                <th class="border-b p-3">Status</th>
                                <th class="border-b p-3">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="border-b p-3">ORD001</td>
                                <td class="border-b p-3">Anu</td>
                                <td class="border-b p-3">
                                    <span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full">
                                        Pending
                                    </span>
                                </td>
                                <td class="border-b p-3">
                                    <a href="orders.html" class="bg-[#FF5A4F] text-white px-3 py-1 rounded-lg">
                                        View
                                    </a>
                                </td>
                            </tr>

                            <tr>
                                <td class="border-b p-3">ORD002</td>
                                <td class="border-b p-3">Aparna</td>
                                <td class="border-b p-3">
                                    <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full">
                                        Accepted
                                    </span>
                                </td>
                                <td class="border-b p-3">
                                    <a href="orders.html" class="bg-[#FF5A4F] text-white px-3 py-1 rounded-lg">
                                        View
                                    </a>
                                </td>
                            </tr>

                            <tr>
                                <td class="border-b p-3">ORD003</td>
                                <td class="border-b p-3">Aswin</td>
                                <td class="border-b p-3">
                                    <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full">
                                        Preparing
                                    </span>

                                </td>
                                <td class="border-b p-3">
                                    <a href="orders.html" class="bg-[#FF5A4F] text-white px-3 py-1 rounded-lg">
                                        View
                                    </a>
                                </td>
                            </tr>
                        </tbody>



                    </table>
                </section>
            </div>
        </main>

    </div>

    <script src="dashboard.js"></script>

</body>

</html>

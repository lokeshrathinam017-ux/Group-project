<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants - CampusBite</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { coral: '#FF5A4F', mint: '#39C6A5' },
          fontFamily: { sans: ['Poppins', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="font-sans bg-white text-gray-800">

  <div id="overlay" class="fixed inset-0 bg-black/40 z-40 hidden" onclick="closeMenu()"></div>

  <div id="sidebar" class="fixed top-0 w-1/2 h-full bg-white z-50 p-5 shadow-lg" style="left:-50%; transition: left 0.3s;">
    <div class="flex justify-between mb-6">
      <b class="text-lg">Campus<span class="text-coral">Bite</span></b>
      <button onclick="closeMenu()" class="text-2xl">&times;</button>
    </div>
    <a href="index.html" class="block py-2">Home</a>
    <a href="restaurant.html" class="block py-2 text-coral font-semibold">Restaurants</a>
    <a href="menu.html" class="block py-2">Menu</a>
    <a href="orders.html" class="block py-2">Orders</a>
    <a href="offers.html" class="block py-2">Offers</a>
  </div>

  <header class="flex justify-between items-center px-4 py-3 border-b sticky top-0 bg-white z-30">
    <div class="flex items-center gap-3">
      <button onclick="openMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
      <a href="index.html" class="font-bold text-xl">Campus<span class="text-coral">Bite</span></a>
    </div>
    <div class="flex items-center gap-4">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
      </svg>
      <button class="relative">
        <svg id="navHeart" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
        <span id="favCount" class="hidden absolute -top-1 -right-2 bg-coral text-white text-xs px-1 rounded-full">0</span>
      </button>
    </div>
  </header>

  <main class="p-4 max-w-4xl mx-auto">

    <div class="flex gap-2 mb-4">
      <div class="flex-1 relative">
        <span class="absolute left-3 top-2.5 text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
        </span>
        <input id="searchBox" type="text" placeholder="Search for restaurants or cuisines..."
          onkeyup="searchDishes()"
          class="w-full pl-10 py-2 rounded-lg bg-gray-100 text-sm outline-none">
      </div>
      <button onclick="filterRating()" class="flex items-center gap-1 border border-coral text-coral px-3 py-2 rounded-lg text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.35 2.077l-1.243.7c-.516.292-1.12.292-1.636 0l-1.243-.7a2.25 2.25 0 01-1.35-2.077V15.35a2.25 2.25 0 00-.659-1.591L2.659 8.409A2.25 2.25 0 012 6.818V5.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z" />
        </svg>
        Filter
      </button>
    </div>

    <h1 class="text-xl font-bold mb-3">All Restaurants</h1>

    <div id="dishGrid" class="flex flex-wrap gap-3"></div>
    <p id="noResult" class="hidden text-center text-gray-500 py-8">No dishes found</p>
  </main>

  <script src="restaurant.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - CampusBite</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-[#F8FAFA] font-['Poppins'] text-[#222222]">

    <div class="min-h-screen">

        <!-- Profile Container -->
        <div class="w-full max-w-md mx-auto bg-white min-h-screen">

            <!-- Header -->
            <div class="flex items-center gap-4 px-5 py-5 border-b border-gray-200">

                <a href="index.html" class="text-xl text-gray-700 hover:text-[#FF5A4F]">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <h1 class="text-xl font-semibold">
                    My Profile
                </h1>

            </div>


            <!-- Profile Details -->
            <div class="bg-[#FFF1EF] px-5 py-6">

                <div class="flex items-center gap-4">

                    <!-- Profile Image -->
                    <img src="./Images_stu/girl.png" alt="Student Profile" class="w-20 h-20 rounded-full object-cover">

                    <!-- Student Details -->
                    <div>

                        <h2 class="text-xl font-semibold">
                            Ananya R.
                        </h2>

                        <p class="text-sm text-[#6B7280] mt-1">
                            ananyar@gmail.com
                        </p>

                        <p class="text-sm text-[#6B7280] mt-1">
                            9876543210
                        </p>

                    </div>

                </div>

            </div>


            <!-- Profile Menu -->
            <div class="px-5 py-4">


                <!-- My Orders -->
                <a href="order_stu.html" class="flex items-center gap-5 py-4 border-b border-gray-100
                           hover:text-[#FF5A4F]">

                    <img src="./Images_stu/order-food.png" alt="order-food" class="w-8 h-8 object-contain">
                    <p class="font-medium">
                        My Orders
                    </p>

                </a>


                <!-- Addresses -->
                <a href="#" class="flex items-center gap-5 py-4 border-b border-gray-100
           hover:text-[#FF5A4F]">

                    <img src="./Images_stu/address.png" alt="address" class="w-8 h-8 object-contain">

                    <p class="font-medium">
                        Addresses
                    </p>

                </a>

                <!-- Payment Methods -->
                <a href="#" class="flex items-center gap-5 py-4 border-b border-gray-100
           hover:text-[#FF5A4F]">

                    <img src="./Images_stu/payment.png" alt="payment" class="w-8 h-8 object-contain">

                    <p class="font-medium">
                        Payment Methods
                    </p>

                </a>


                <!-- Favorites -->
                <a href="#" class="flex items-center gap-5 py-4 border-b border-gray-100
           hover:text-[#FF5A4F]">

                    <img src="./Images_stu/favourite.png" alt="Favourites" class="w-8 h-8 object-contain">

                    <p class="font-medium">
                        Favorites
                    </p>

                </a>


                <!-- Coupons -->
                <a href="#" class="flex items-center gap-5 py-4 border-b border-gray-100
           hover:text-[#FF5A4F]">

                    <img src="./Images_stu/coupons.png" alt="Coupons" class="w-8 h-8 object-contain">

                    <p class="font-medium">
                        Coupons
                    </p>

                </a>


                <!-- Help -->
                <a href="#" class="flex items-center gap-5 py-4 border-b border-gray-100
           hover:text-[#FF5A4F]">

                    <img src="./Images_stu/support.png" alt="Support" class="w-8 h-8 object-contain">

                    <p class="font-medium">
                        Help & Support
                    </p>

                </a>


                <!-- Logout -->
                <button class="flex items-center gap-5 py-4 w-full
               text-[#222222] hover:text-[#FF5A4F] hover:font-semibold">

                    <img src="./Images_stu/logout.png" alt="Logout" class="w-8 h-8 object-contain">

                    <p class="font-medium">
                        Logout
                    </p>

                </button>

            </div>

        </div>

    </div>

</body>

</html>
